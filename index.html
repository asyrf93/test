
<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Katalog Perabot Solid Wood</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-stone-100 text-stone-800 min-h-screen">

  <!-- Header -->
  <header class="bg-amber-950 text-amber-50 py-6 px-4 shadow">
    <div class="max-w-4xl mx-auto flex justify-between items-center">
      <div>
        <h1 class="text-2xl font-bold tracking-wide">Katalog Kayu Kiri</h1>
        <p class="text-xs text-amber-200 mt-1">Perabot Solid Wood Buatan Tangan</p>
      </div>
      <span class="text-xs bg-amber-900 border border-amber-700 px-3 py-1 rounded-full text-amber-200">
        Ready Stock & Custom
      </span>
    </div>
  </header>

  <!-- Container Katalog -->
  <main class="max-w-4xl mx-auto p-4 sm:p-6">
    <div id="loading" class="text-center py-12 text-stone-500">
      Sedang memuatkan katalog...
    </div>

    <div id="grid-produk" class="grid grid-cols-1 sm:grid-cols-2 gap-6 hidden">
      <!-- Kad produk akan dijana di sini oleh JavaScript -->
    </div>
  </main>

  <script>
    // Nombor WhatsApp perniagaan (format: 601xxxxxxxxx)
    const WHATSAPP_PHONE = "60123456789";

    async function loadCatalog() {
      const loading = document.getElementById("loading");
      const grid = document.getElementById("grid-produk");

      try {
        // Panggil endpoint API Cloudflare Pages Function tadi
        const res = await fetch("/api/products");
        const items = await res.json();

        loading.classList.add("hidden");
        grid.classList.remove("hidden");

        if (!items || items.length === 0) {
          loading.innerText = "Tiada produk dalam katalog buat masa ini.";
          loading.classList.remove("hidden");
          return;
        }

        grid.innerHTML = items.map(item => {
          // Mesej WhatsApp auto-populate
          const waMessage = encodeURIComponent(
            `Salam, saya berminat nak tanya pasal ${item.title} (RM${item.price}). Item ni masih ada stok ke?`
          );
          const waUrl = `https://wa.me/${WHATSAPP_PHONE}?text=${waMessage}`;

          const isReady = item.stock_status === "Ready Stock";

          return `
            <div class="bg-white rounded-xl shadow-sm border border-stone-200 overflow-hidden flex flex-col justify-between hover:shadow-md transition">
              <div class="p-5">
                <div class="flex justify-between items-start gap-2 mb-2">
                  <h2 class="text-lg font-bold text-stone-900 leading-snug">${item.title}</h2>
                  <span class="text-xs px-2.5 py-1 rounded-full font-medium shrink-0 ${
                    isReady ? 'bg-emerald-100 text-emerald-800' : 'bg-amber-100 text-amber-800'
                  }">
                    ${item.stock_status || 'Ready Stock'}
                  </span>
                </div>
                
                <p class="text-sm text-stone-600 mb-4">
                  ${item.material || 'Solid Rubberwood'}
                </p>

                <div class="text-2xl font-black text-amber-900">
                  RM ${Number(item.price).toFixed(2)}
                </div>
              </div>

              <div class="p-4 bg-stone-50 border-t border-stone-100">
                <a href="${waUrl}" target="_blank" 
                   class="w-full flex items-center justify-center gap-2 bg-emerald-600 hover:bg-emerald-700 text-white font-semibold py-2.5 px-4 rounded-lg shadow-sm transition">
                  <svg class="w-5 h-5 fill-current" viewBox="0 0 24 24">
                    <path d="M12.031 6.172c-3.181 0-5.767 2.586-5.768 5.766-.001 1.298.38 2.27 1.019 3.287l-.582 2.128 2.182-.573c.978.58 1.911.928 3.145.929 3.178 0 5.767-2.587 5.768-5.766.001-3.187-2.575-5.77-5.764-5.771zm3.392 8.244c-.144.405-.837.774-1.17.824-.299.045-.677.063-1.092-.069-.252-.08-.575-.187-.988-.365-1.739-.751-2.874-2.502-2.961-2.617-.087-.116-.708-.94-.708-1.793s.448-1.273.607-1.446c.159-.173.346-.217.462-.217l.332.007c.106.005.249-.04.39.298.144.347.491 1.2.534 1.287.043.087.072.188.014.304-.058.116-.087.188-.173.289l-.26.304c-.087.086-.177.18-.076.354.101.174.449.741.964 1.201.662.591 1.221.774 1.394.861.174.086.275.072.376-.044.101-.116.433-.506.549-.68.116-.173.231-.144.39-.086s1.011.477 1.184.564.289.13.332.202c.043.073.043.419-.101.824z"/>
                  </svg>
                  Tanya di WhatsApp
                </a>
              </div>
            </div>
          `;
        }).join('');

      } catch (err) {
        loading.innerText = "Gagal memuatkan data. Sila semak semula sambungan pangkalan data.";
        console.error(err);
      }
    }

    loadCatalog();
  </script>
</body>
</html>
